[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "seifselims", email = "124066228+seifselims@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "ddgs>=9.16.1",
    "fastapi>=0.162.4",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "litellm>=1.108.4",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "sse-starlette>=3.7.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names, undefined vars), I: import order,
# UP: modern Python syntax, B: likely bugs, ASYNC: asyncio mistakes, SIM: simpler code
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "SIM"]
