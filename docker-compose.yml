name: research-agent

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: deepscout
      POSTGRES_PASSWORD: deepscout
      POSTGRES_DB: deepscout
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepscout -d deepscout"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
